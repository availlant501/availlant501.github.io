<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% if page.math %}
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  {% endif %}
</head>
<body class="{% if page.url == '/' %}home{% endif %}">
  <header class="site-header">
    <a class="site-name" href="{{ '/' | relative_url }}">Andre Vaillant</a>
    <nav aria-label="Main">
      <a href="{{ '/writing/' | relative_url }}" {% if page.url contains '/writing/' %}aria-current="page"{% endif %}>Writing</a>
      <span class="soon">CV coming soon</span>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>Say hello at <a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
    <p class="footer-links">
      <a href="{{ site.links.github }}">GitHub</a>
      {% if site.links.linkedin != "" %}<a href="{{ site.links.linkedin }}">LinkedIn</a>{% endif %}
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </p>
  </footer>

  {% if page.url == '/' %}
  <script src="{{ '/assets/js/paths.js' | relative_url }}" defer></script>
  {% endif %}
</body>
</html>
